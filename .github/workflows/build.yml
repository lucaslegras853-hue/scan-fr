name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fichiers Android
        run: |
          flutter create --org com.lucas --project-name scan_fr --platforms android .
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="scan_fr"#android:label="Scan FR"#' $M

      - name: Modules
        run: |
          rm -rf test
          flutter pub get || flutter pub upgrade --major-versions
          # Compatibilité des modules avec le nouvel outil de build Android
          find ~/.pub-cache/hosted/pub.dev -path '*/android/build.gradle*' -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} +

      - name: Construction
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1 || true
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Envoyer le journal d'erreur (branche logs)
        if: failure()
        run: |
          mkdir /tmp/logs && cp *.log /tmp/logs/ || true
          git config user.name "build-bot" && git config user.email "bot@users.noreply.github.com"
          git checkout --orphan logs && git rm -rf --cached . >/dev/null
          cp /tmp/logs/*.log . && git add -f *.log && git commit -m "Journal run ${{ github.run_number }}"
          git push -f origin logs

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Scan FR v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
